<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0B2545">
  <title>Tech Home — PrimeCool Services</title>
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:#0B2545; --navy-2:#143264; --teal:#22A08A; --teal-dark:#188672;
      --orange:#F39722; --bg:#F4F6F9; --card:#fff; --border:#e5e7eb;
      --muted:#6b7280; --text:#0f172a; --danger:#dc2626; --success:#15803d;
      --warn:#b45309; --warn-bg:#fef3c7;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{margin:0;background:var(--bg);color:var(--text);
         font-family:'Barlow',-apple-system,system-ui,sans-serif;
         font-size:15px;line-height:1.45;
         padding-bottom:env(safe-area-inset-bottom);}
    a{color:var(--navy);text-decoration:none;}
    button{font-family:inherit;cursor:pointer;}
    .hdr{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
         color:#fff;padding:18px 16px;display:flex;align-items:center;
         justify-content:space-between;gap:12px;
         padding-top:calc(18px + env(safe-area-inset-top));}
    .hdr-l{display:flex;flex-direction:column;gap:2px;min-width:0;}
    .hdr-name{font-size:17px;font-weight:600;white-space:nowrap;
              overflow:hidden;text-overflow:ellipsis;}
    .hdr-sub{font-size:12px;opacity:.75;}
    .hdr-out{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);
             border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;}
    .container{max-width:680px;margin:0 auto;padding:14px;}
    .tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);
          border:1px solid var(--border);border-radius:12px;overflow:hidden;
          margin-bottom:14px;}
    .tabs button{background:transparent;border:none;padding:14px 10px;
                 font-size:14px;font-weight:600;color:var(--muted);
                 border-bottom:3px solid transparent;}
    .tabs button.active{color:var(--navy);background:#fff;
                        border-bottom-color:var(--teal);}
    .card{background:var(--card);border:1px solid var(--border);
          border-radius:12px;padding:16px;margin-bottom:14px;}
    .card h2{margin:0 0 10px;font-size:16px;color:var(--navy);}
    .row{display:flex;align-items:center;gap:10px;justify-content:space-between;}
    .row + .row{margin-top:8px;}
    .muted{color:var(--muted);font-size:13px;}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;
          border-radius:999px;font-size:12px;font-weight:600;
          background:#eef2f7;color:var(--navy);}
    .pill-success{background:rgba(34,160,138,.15);color:var(--teal-dark);}
    .pill-warn{background:var(--warn-bg);color:var(--warn);}
    .pill-danger{background:#fee2e2;color:var(--danger);}
    .clock-display{font-size:34px;font-weight:700;color:var(--navy);
                   letter-spacing:.5px;text-align:center;margin:6px 0 2px;}
    .date-display{text-align:center;color:var(--muted);font-size:13px;
                  margin-bottom:14px;}
    .schedule-line{display:flex;justify-content:space-between;
                   padding:10px 12px;background:#f8fafc;border-radius:8px;
                   font-size:14px;margin-bottom:6px;}
    .schedule-line strong{color:var(--navy);}
    .jobs-line{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;
               color:var(--muted);margin-top:8px;}
    .jobs-chip{padding:4px 10px;background:#f3f4f6;border-radius:6px;}
    .btn{display:inline-flex;align-items:center;justify-content:center;
         padding:14px 18px;border:none;border-radius:10px;font-size:16px;
         font-weight:600;width:100%;}
    .btn-primary{background:var(--teal);color:#fff;}
    .btn-primary:disabled{background:#9ca3af;}
    .btn-danger{background:var(--danger);color:#fff;}
    .btn-ghost{background:#f3f4f6;color:var(--navy);border:1px solid var(--border);}
    .btn + .btn{margin-top:10px;}
    .alert{padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.45;
           margin-bottom:12px;}
    .alert-warn{background:var(--warn-bg);color:var(--warn);
                border:1px solid #fde68a;}
    .alert-info{background:#dbeafe;color:#1e3a8a;border:1px solid #bfdbfe;}
    .alert-danger{background:#fee2e2;color:#991b1b;border:1px solid #fecaca;}
    .alert-success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0;}
    .alert a{font-weight:600;text-decoration:underline;}
    textarea.modal-input{width:100%;padding:10px;border:1px solid var(--border);
                         border-radius:8px;font-family:inherit;font-size:14px;
                         resize:vertical;min-height:70px;margin:8px 0;}
    .msg{padding:12px 14px;background:#f8fafc;border:1px solid var(--border);
         border-radius:10px;margin-bottom:10px;}
    .msg-hd{display:flex;justify-content:space-between;align-items:baseline;
            gap:10px;margin-bottom:6px;}
    .msg-title{font-weight:600;color:var(--navy);font-size:14px;}
    .msg-when{font-size:11px;color:var(--muted);white-space:nowrap;}
    .msg-body{font-size:13px;color:var(--text);white-space:pre-wrap;
              line-height:1.5;}
    .empty{padding:18px 12px;text-align:center;color:var(--muted);font-size:13px;}
    .elapsed{font-variant-numeric:tabular-nums;font-weight:600;
             color:var(--teal-dark);}
    @media (max-width:380px){.clock-display{font-size:28px;}}
  </style>
</head>
<body>
  <header class="hdr">
    <!-- Brand block is also the "home" button across the tech portal:
         the logo + name in /tech (jobs queue), /tech/home (this page),
         and the 5S audit screen all link back here so techs have a
         consistent way to return without needing a back button. -->
    <a href="/tech/home" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px;min-width:0;flex:1;">
      <div style="width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;letter-spacing:.5px;flex-shrink:0;">PC</div>
      <div class="hdr-l">
        <div class="hdr-name" id="hdrName">…</div>
        <div class="hdr-sub" id="hdrSub">PrimeCool Services</div>
      </div>
    </a>
    <button class="hdr-out" onclick="doLogout()">Sign out</button>
  </header>

  <div class="container">
    <div class="tabs">
      <button id="tabSignin" class="active" onclick="switchTab('signin')">
        Sign In for Work
      </button>
      <button id="tabProfile" onclick="switchTab('profile')">
        My Profile
      </button>
    </div>

    <!-- ── Sign In for Work tab ──────────────────────────────────── -->
    <section id="paneSignin">
      <div class="card">
        <div class="clock-display" id="liveClock">--:--</div>
        <div class="date-display" id="liveDate">…</div>

        <div class="schedule-line" id="scheduleLine">
          <span>Today's schedule</span><strong>Loading…</strong>
        </div>

        <div class="jobs-line" id="jobsLine"></div>
      </div>

      <div id="statusArea"></div>

      <div class="card">
        <div class="row" style="margin-bottom:8px;">
          <h2 style="margin:0;">Today's Jobs</h2>
          <button class="btn-ghost" style="padding:8px 12px;border-radius:8px;
                  font-size:13px;font-weight:600;border:1px solid var(--border);
                  background:#f3f4f6;color:var(--navy);width:auto;"
                  onclick="goJobs()">Open jobs queue →</button>
        </div>
        <div class="muted" id="jobsSummary">…</div>
      </div>

      <div class="card">
        <h2>Company Message Board</h2>
        <div id="messages"><div class="empty">Loading…</div></div>
      </div>
    </section>

    <!-- ── My Profile tab ────────────────────────────────────────── -->
    <section id="paneProfile" style="display:none;">
      <div class="card">
        <h2>My Profile</h2>
        <div id="profileBody"><div class="empty">Loading…</div></div>
      </div>
      <div class="card">
        <div class="muted" style="font-size:13px;">
          Full profile page with CV, certifications, KPI history, and pay
          schedule is coming in the next release (TP-4).
        </div>
      </div>
    </section>
  </div>

  <script src="/static/pc_shared.js"></script>
  <script>
    // ── Auth bootstrap ────────────────────────────────────────────────
    const token = localStorage.getItem('pc_tech_token');
    if (!token) { window.location.replace('/tech'); }

    // ── State ─────────────────────────────────────────────────────────
    let overview = null;     // GET /api/tech/me/today-overview cache
    let profile  = null;     // GET /api/tech/me/profile cache
    let elapsedTimer = null; // setInterval id for live clock-in elapsed

    // ── Helpers ───────────────────────────────────────────────────────
    function esc(s) {
      return (s == null ? '' : String(s)).replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function fmt12(hhmm) {
      if (!hhmm) return '';
      const [h, m] = String(hhmm).split(':').map(Number);
      if (isNaN(h)) return '';
      const period = h >= 12 ? 'PM' : 'AM';
      return `${(h % 12) || 12}:${String(m || 0).padStart(2,'0')} ${period}`;
    }
    function relTime(iso) {
      if (!iso) return '';
      const then = new Date(iso);
      const diffMs = Date.now() - then.getTime();
      const s = Math.floor(diffMs / 1000);
      if (s < 60) return 'just now';
      const m = Math.floor(s / 60);
      if (m < 60) return `${m} min ago`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h ago`;
      const d = Math.floor(h / 24);
      if (d < 7)  return `${d}d ago`;
      return then.toLocaleDateString('en-TT',
                                     {day:'numeric',month:'short',year:'numeric'});
    }
    function elapsedFrom(iso) {
      const diff = Math.max(0, Date.now() - new Date(iso).getTime());
      const s = Math.floor(diff / 1000);
      const hh = String(Math.floor(s / 3600)).padStart(2,'0');
      const mm = String(Math.floor((s % 3600) / 60)).padStart(2,'0');
      const ss = String(s % 60).padStart(2,'0');
      return `${hh}:${mm}:${ss}`;
    }
    async function api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type':'application/json',
                   'Authorization': `Bearer ${token}` },
        body: body ? JSON.stringify(body) : undefined,
      });
      let data = null;
      try { data = await res.json(); } catch (_) {}
      if (!res.ok) {
        const err = new Error((data && (data.detail || data.message)) || res.statusText);
        err.status = res.status;
        err.body = data;
        throw err;
      }
      return data;
    }
    async function doLogout() {
      try {
        await fetch('/api/tech/logout', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
        });
      } catch {}
      localStorage.removeItem('pc_tech_token');
      try { sessionStorage.clear(); } catch {}
      window.location.replace('/tech');
    }
    function goJobs() {
      window.location.assign('/tech?view=jobs');
    }
    function go5S() {
      window.location.assign('/tech?view=5s');
    }

    // ── Tab switching ─────────────────────────────────────────────────
    function switchTab(t) {
      document.getElementById('tabSignin').classList.toggle('active', t === 'signin');
      document.getElementById('tabProfile').classList.toggle('active', t === 'profile');
      document.getElementById('paneSignin').style.display  = (t === 'signin')  ? '' : 'none';
      document.getElementById('paneProfile').style.display = (t === 'profile') ? '' : 'none';
      if (t === 'profile' && !profile) loadProfile();
    }

    // ── Live clock ────────────────────────────────────────────────────
    function tickClock() {
      const now = new Date();
      const hh = now.getHours();
      const mm = String(now.getMinutes()).padStart(2,'0');
      const period = hh >= 12 ? 'PM' : 'AM';
      const h12 = (hh % 12) || 12;
      document.getElementById('liveClock').textContent =
        `${h12}:${mm} ${period}`;
      document.getElementById('liveDate').textContent =
        now.toLocaleDateString('en-TT', {weekday:'long', day:'numeric',
                                         month:'long', year:'numeric'});
    }
    tickClock();
    setInterval(tickClock, 30 * 1000);

    // ── Load today's overview ─────────────────────────────────────────
    async function loadOverview() {
      try {
        overview = await api('GET', '/api/tech/me/today-overview');
      } catch (e) {
        if (e.status === 401) { doLogout(); return; }
        document.getElementById('statusArea').innerHTML =
          `<div class="alert alert-danger">Could not load today's status: ${esc(e.message)}</div>`;
        return;
      }
      renderSchedule();
      renderJobsSummary();
      renderStatus();
    }

    function renderSchedule() {
      const el = document.getElementById('scheduleLine');
      const s = overview && overview.schedule_today;
      const onCall = overview && overview.on_call_today;
      if (onCall) {
        // On-call replaces the schedule line entirely — the tech is
        // explicitly allowed to be available outside business hours,
        // so showing a "Day off" or fixed end time would be misleading.
        el.innerHTML = `<span>Today</span>
          <strong style="color:var(--teal-dark);">On call — no end-of-shift cutoff</strong>`;
        return;
      }
      if (s && s.active && s.start && s.end) {
        el.innerHTML = `<span>Today's schedule</span>
          <strong>${esc(fmt12(s.start))} – ${esc(fmt12(s.end))}</strong>`;
      } else {
        el.innerHTML = `<span>Today's schedule</span>
          <strong style="color:var(--orange);">Day off</strong>`;
      }
    }

    function renderJobsSummary() {
      const total = (overview && overview.jobs_today_total) || 0;
      const pm = (overview && overview.pm_count) || 0;
      const cm = (overview && overview.cm_count) || 0;
      const line = document.getElementById('jobsLine');
      const summ = document.getElementById('jobsSummary');
      if (!total) {
        line.innerHTML = '';
        summ.textContent = 'No jobs assigned for today.';
      } else {
        line.innerHTML =
          `<span class="jobs-chip">${pm} PM</span>` +
          `<span class="jobs-chip">${cm} CM</span>` +
          `<span class="jobs-chip">${total} total</span>`;
        summ.textContent = `${total} job${total === 1 ? '' : 's'} assigned for today.`;
      }
    }

    function renderStatus() {
      const area = document.getElementById('statusArea');
      const isDayOff = !(overview && overview.schedule_today
                          && overview.schedule_today.active);
      const signedIn = overview && overview.sign_in_status === 'signed_in';

      // Stop any running elapsed-timer; we restart it if still clocked in.
      if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }

      if (signedIn) {
        const since = overview.signed_in_at;
        const inOt  = !!overview.in_overtime;
        const otOk  = !!overview.overtime_approved;
        const autoAt = overview.auto_signout_at; // ISO string or null
        // OT banner — three states:
        //   approved        → green "admin has approved overtime"
        //   pending + grace → orange "auto sign-out in 1h 14m" (live countdown)
        //   pending no auto → orange "overtime requires admin approval"
        let otBanner = '';
        if (inOt && otOk) {
          otBanner = `<div class="alert alert-success">You are past your scheduled end of day, but admin has approved overtime.</div>`;
        } else if (inOt && autoAt) {
          otBanner = `<div class="alert alert-warn">
            <strong>You are past your scheduled end of day.</strong><br>
            Overtime requires admin approval.
            <span id="autoSignoutCountdown" style="display:block;margin-top:6px;font-weight:600;"></span>
          </div>`;
        } else if (inOt) {
          otBanner = `<div class="alert alert-warn"><strong>You are past your scheduled end of day.</strong> Overtime requires admin approval — please contact your supervisor.</div>`;
        }
        area.innerHTML = `
          ${otBanner}
          <div class="card">
            <div class="row">
              <div>
                <div class="muted" style="font-size:12px;">Signed in</div>
                <div style="font-weight:600;font-size:15px;">
                  ${esc(new Date(since).toLocaleTimeString('en-TT',
                    {hour:'numeric',minute:'2-digit'}))}
                </div>
              </div>
              <div style="text-align:right;">
                <div class="muted" style="font-size:12px;">Elapsed</div>
                <div class="elapsed" id="elapsed">${esc(elapsedFrom(since))}</div>
              </div>
            </div>
            <button class="btn btn-danger" style="margin-top:14px;"
                    onclick="doSignOut()">Sign Out</button>
            <div class="muted" style="font-size:12px;text-align:center;margin-top:10px;">
              Sign-out will take you through your 5S end-of-shift audit first.
            </div>
          </div>`;
        elapsedTimer = setInterval(() => {
          const el = document.getElementById('elapsed');
          if (!el) { clearInterval(elapsedTimer); elapsedTimer = null; return; }
          el.textContent = elapsedFrom(since);
          // Countdown until auto-sign-out fires.
          const cd = document.getElementById('autoSignoutCountdown');
          if (cd && autoAt) {
            const remainMs = new Date(autoAt).getTime() - Date.now();
            if (remainMs <= 0) {
              cd.textContent = 'Auto sign-out is firing now…';
            } else {
              const totalMin = Math.floor(remainMs / 60000);
              const h = Math.floor(totalMin / 60);
              const m = totalMin % 60;
              cd.textContent = `Auto sign-out in ${h > 0 ? h + 'h ' : ''}${m}m`;
            }
          }
        }, 1000);
        return;
      }

      // Not signed in.
      if (isDayOff) {
        area.innerHTML = `
          <div class="alert alert-info">
            Today is your scheduled day off. If you're signing in anyway, give
            us a brief reason — payroll and your supervisor will be notified.
          </div>
          <div class="card">
            <label class="muted" style="font-size:13px;">Reason for signing in on a day off</label>
            <textarea id="dayoffReason" class="modal-input"
                      placeholder="e.g. covering for Marcus, callout at Royal Plaza"></textarea>
            <button class="btn btn-primary" onclick="doSignIn(true)">
              Sign In (day off)
            </button>
          </div>`;
        return;
      }

      area.innerHTML = `
        <div class="card">
          <button class="btn btn-primary" onclick="doSignIn(false)">
            Sign In for Work
          </button>
          <div class="muted" style="font-size:12px;text-align:center;margin-top:10px;">
            Your 5S start-of-shift audit must be complete before sign-in.
          </div>
        </div>`;
    }

    // ── Sign in / out actions ─────────────────────────────────────────
    async function doSignIn(isDayOff) {
      const body = {};
      if (isDayOff) {
        const reason = (document.getElementById('dayoffReason').value || '').trim();
        if (!reason) {
          PC.toast('Day-off sign-in requires a reason.', 'warning');
          return;
        }
        body.dayoff_reason = reason;
      }
      try {
        await api('POST', '/api/tech/me/sign-in', body);
        PC.toast('Signed in.', 'success');
        await loadOverview();
      } catch (e) {
        if (e.status === 409 && /5s_start_shift_required/i.test(e.message)) {
          renderGate('start');
          return;
        }
        if (e.status === 409 && /dayoff_reason_required/i.test(e.message)) {
          PC.toast('Please enter a reason for signing in on a day off.', 'warning');
          return;
        }
        PC.toast(e.message || 'Sign-in failed.', 'error');
      }
    }

    async function doSignOut() {
      // Per spec: sign-out always routes through the 5S end-shift audit
      // FIRST — the actual /api/tech/me/sign-out call happens after the
      // audit submits successfully (tech.html handles the continuation
      // when ?pending=signout is present in the URL).
      if (!confirm('Sign out for the day? You\'ll complete your 5S end-of-shift audit on the next screen.')) return;
      window.location.assign('/tech?view=5s&pending=signout');
    }

    function renderGate(which) {
      const label = (which === 'start')
        ? 'start-of-shift'
        : 'end-of-shift';
      const area = document.getElementById('statusArea');
      area.innerHTML = `
        <div class="alert alert-warn">
          <strong>5S ${esc(label)} audit required.</strong><br>
          Please complete your 5S workplace audit before ${which === 'start' ? 'signing in' : 'signing out'}.
        </div>
        <div class="card">
          <button class="btn btn-primary" onclick="go5S()">
            Open 5S audit
          </button>
          <button class="btn btn-ghost" onclick="loadOverview()" style="margin-top:10px;">
            I've finished — recheck
          </button>
        </div>`;
    }

    // ── Profile tab ───────────────────────────────────────────────────
    async function loadProfile() {
      try {
        if (!profile) profile = await api('GET', '/api/tech/me/profile');
      } catch (e) {
        document.getElementById('profileBody').innerHTML =
          `<div class="empty">Could not load profile: ${esc(e.message)}</div>`;
        return;
      }
      const p = profile || {};
      const rows = [
        ['Name',         p.name],
        ['Tech code',    p.tech_code],
        ['Role',         p.role],
        ['Phone',        p.phone],
        ['Email',        p.email],
      ];
      document.getElementById('profileBody').innerHTML =
        rows.map(([l, v]) =>
          `<div class="schedule-line">
             <span>${esc(l)}</span>
             <strong>${v ? esc(v) : '<span style="color:var(--muted);font-weight:400;">—</span>'}</strong>
           </div>`).join('');
    }

    // ── Message board ─────────────────────────────────────────────────
    async function loadMessages() {
      const el = document.getElementById('messages');
      try {
        const list = await api('GET', '/api/company/messages?limit=10');
        if (!list || !list.length) {
          el.innerHTML = '<div class="empty">No company messages right now.</div>';
          return;
        }
        el.innerHTML = list.map(m => `
          <div class="msg">
            <div class="msg-hd">
              <div class="msg-title">${esc(m.title || 'Untitled')}</div>
              <div class="msg-when" title="${esc(m.posted_at || '')}">${esc(relTime(m.posted_at))}</div>
            </div>
            <div class="msg-body">${esc(m.body || '')}</div>
          </div>`).join('');
      } catch (e) {
        el.innerHTML = `<div class="empty">Could not load messages: ${esc(e.message)}</div>`;
      }
    }

    // ── Header (cheap: pull name from profile lazily) ─────────────────
    async function loadHeader() {
      // /api/tech/me/profile is light (single row, no jobs) and is reused
      // when the Profile tab is opened — so this call doubles as a prefetch.
      try {
        if (!profile) profile = await api('GET', '/api/tech/me/profile');
        document.getElementById('hdrName').textContent = profile.name || 'Technician';
        document.getElementById('hdrSub').textContent  =
          [profile.tech_code, profile.role].filter(Boolean).join(' · ') || 'PrimeCool Services';
      } catch (_) { /* header stays as the loading placeholder */ }
    }

    // ── Boot ──────────────────────────────────────────────────────────
    loadHeader();
    loadOverview();
    loadMessages();

    // Refresh overview every 60s so the elapsed-clock + overtime flip
    // stays accurate without manual reload.
    setInterval(loadOverview, 60 * 1000);
  </script>
