<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>New Hire Onboarding · PrimeCool</title>
  <style>
    :root {
      --navy:#0B2545; --navy-2:#1B4F82; --ink:#0B2545;
      --teal:#22A08A; --teal-dark:#1A7A6A;
      --bg:#F2F6FA; --card:#fff;
      --border:#E5EBF1; --border-light:#EEF2F6;
      --muted:#5A6472; --muted-2:#8892A0; --text:#2C3340;
      --danger:#B42318; --danger-bg:#FEF3F2; --link:#1B4F82;
      --warn-bg:#FFF7E6; --warn-fg:#7a5b00; --warn-border:#f0d28a;
      --ok-bg:#E0F2F1; --ok-fg:#1A7A6A;
      --font-display:'Archivo','Segoe UI',system-ui,sans-serif;
      --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
      --shadow-card:0 1px 2px rgba(11,37,69,.04), 0 1px 3px rgba(11,37,69,.06);
      --accent-h:3px;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    input,select,textarea{background:var(--card);color:var(--ink);font:inherit;}
    input::placeholder,textarea::placeholder{color:var(--muted-2);}
    html,body{height:100%;}
    body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
    body::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--accent-h);background:var(--navy);z-index:60;}
    a{color:var(--link);text-decoration:none;}

    .topbar{position:sticky;top:var(--accent-h);height:56px;background:var(--card);border-bottom:1px solid var(--border);
      display:flex;align-items:center;gap:12px;padding:0 18px;z-index:50;}
    .brand-lockup{display:flex;align-items:center;gap:10px;color:var(--ink);}
    .brand-lockup .word{font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-0.01em;}
    .brand-lockup .word span{color:var(--teal);}
    .pc-snowflake{display:inline-block;width:22px;height:22px;background:var(--teal);border-radius:6px;position:relative;}
    .pc-snowflake::before{content:"";position:absolute;inset:4px;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230B2545' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><line x1='12' y1='2' x2='12' y2='22'/><line x1='2' y1='12' x2='22' y2='12'/><line x1='4.93' y1='4.93' x2='19.07' y2='19.07'/><line x1='19.07' y1='4.93' x2='4.93' y2='19.07'/></svg>");
      background-size:contain;background-repeat:no-repeat;}
    .topbar .crumb{color:var(--muted);font-size:13px;}
    .topbar .spacer{flex:1;}
    .save-state{font-size:12px;color:var(--muted-2);}

    .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 80px;display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start;}
    @media(max-width:820px){.wrap{grid-template-columns:1fr;}}

    /* Step rail */
    .steps{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-card);padding:10px;position:sticky;top:78px;}
    @media(max-width:820px){.steps{position:static;display:flex;overflow-x:auto;gap:4px;}}
    .step{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:none;background:transparent;color:var(--text);
      font-size:13.5px;padding:11px 12px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap;}
    .step:hover{background:var(--bg);}
    .step.active{background:var(--ok-bg);color:var(--teal-dark);}
    .step .num{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:700;background:var(--bg);color:var(--muted);border:1px solid var(--border);}
    .step.active .num{background:var(--teal);color:#fff;border-color:var(--teal);}
    .step.done .num{background:var(--teal-dark);color:#fff;border-color:var(--teal-dark);}

    .panel{min-height:400px;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-card);padding:24px;margin-bottom:18px;}
    .card h1{font-family:var(--font-display);font-size:23px;color:var(--ink);font-weight:800;margin-bottom:4px;}
    .card h2{font-family:var(--font-display);font-size:19px;color:var(--ink);font-weight:800;margin-bottom:3px;}
    .card .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px;line-height:1.5;}
    .sec-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px;}
    .sec-head h3{font-family:var(--font-display);font-size:15px;color:var(--ink);font-weight:700;}

    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
    @media(max-width:560px){.grid{grid-template-columns:1fr;}}
    .fld{display:flex;flex-direction:column;gap:5px;}
    .fld.full{grid-column:1 / -1;}
    .fld label{font-size:12.5px;color:var(--muted);font-weight:600;}
    .fld label .req{color:var(--danger);}
    .fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-size:14px;width:100%;}
    .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--ok-bg);}
    .fld .hint{font-size:11.5px;color:var(--muted-2);}
    .fld input[readonly]{background:var(--bg);color:var(--muted);cursor:not-allowed;}

    .btn{border:1px solid var(--border);background:var(--card);color:var(--ink);font-size:14px;font-weight:600;
      padding:10px 18px;border-radius:9px;cursor:pointer;}
    .btn:hover{background:var(--bg);}
    .btn-teal{background:var(--teal);border-color:var(--teal);color:#fff;}
    .btn-teal:hover{background:var(--teal-dark);}
    .btn-sm{padding:7px 12px;font-size:13px;}
    .btn-danger{color:var(--danger);border-color:#f3c9c4;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px;}

    .item{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border:1px solid var(--border);
      border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--bg);}
    .item .it-title{font-weight:700;color:var(--ink);font-size:14px;}
    .item .it-meta{font-size:12.5px;color:var(--muted);margin-top:2px;}

    .ack{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:13px 14px;margin-bottom:10px;}
    .ack input{margin-top:3px;width:17px;height:17px;flex-shrink:0;}
    .ack .ack-t{font-weight:700;color:var(--ink);font-size:14px;}
    .ack .ack-d{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5;}

    .banner{border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:16px;line-height:1.5;}
    .banner.info{background:#E7F0F7;border:1px solid #cfe0f0;color:#1B4F82;}
    .banner.warn{background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-fg);}
    .banner.ok{background:var(--ok-bg);border:1px solid #b8e0d8;color:var(--ok-fg);}

    .center-screen{max-width:560px;margin:60px auto;padding:0 18px;text-align:center;}
    .center-screen .big-ico{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      margin:0 auto 18px;font-size:34px;}
    .review-grp{border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden;}
    .review-grp .rh{background:var(--bg);padding:10px 14px;font-weight:700;font-size:13.5px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;}
    .review-grp .rb{padding:6px 14px 12px;}
    .rrow{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px solid var(--border-light);font-size:13.5px;}
    .rrow:last-child{border-bottom:none;}
    .rrow .rk{color:var(--muted-2);}
    .rrow .rv{color:var(--ink);font-weight:500;text-align:right;}
    .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
      padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;}
    .toast.show{opacity:1;}
    .toast.error{background:var(--danger);}
    .spinner{display:inline-block;width:42px;height:42px;border:4px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand-lockup"><span class="pc-snowflake"></span><span class="word">Prime<span>Cool</span></span></div>
    <span class="crumb">New Hire Onboarding</span>
    <span class="spacer"></span>
    <span class="save-state" id="saveState"></span>
  </div>

  <div id="root">
    <div class="center-screen"><div class="spinner"></div><p style="margin-top:16px;color:var(--muted);">Loading your onboarding…</p></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const root = $('root');
  let toastTimer;
  function toast(msg, kind){
    const t=$('toast'); t.textContent=msg; t.className='toast show'+(kind==='error'?' error':'');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.className='toast',2600);
  }

  // Token from the query string is the ONLY credential. No staff cookie here.
  const TOKEN = new URLSearchParams(location.search).get('token') || '';

  // ── Jamaica reference data ──────────────────────────────────────────────
  const PARISHES = ["Kingston","St. Andrew","St. Catherine","Clarendon","Manchester",
    "St. Elizabeth","Westmoreland","Hanover","St. James","Trelawny","St. Ann",
    "St. Mary","Portland","St. Thomas"];
  const BANKS = ["National Commercial Bank (NCB)","Bank of Nova Scotia (Scotiabank)",
    "JN Bank","Sagicor Bank","First Global Bank","CIBC Caribbean","JMMB Bank",
    "Victoria Mutual Building Society (VMBS)","COK Sodality Co-operative Credit Union",
    "Other Jamaican bank / credit union"];
  // Policy documents the new hire must acknowledge. version lets HR re-issue
  // and re-collect acknowledgements later without losing the old record.
  const POLICIES = [
    {key:"handbook",      title:"Employee Handbook",                 version:"2026.1", desc:"PrimeCool's general terms of employment, conduct expectations, and benefits overview."},
    {key:"code_conduct",  title:"Code of Conduct",                   version:"2026.1", desc:"Professional standards, conflicts of interest, and ethical guidelines."},
    {key:"health_safety", title:"Health & Safety Policy",            version:"2026.1", desc:"Occupational Safety & Health Act (Jamaica) obligations, PPE, and incident reporting."},
    {key:"it_use",        title:"IT & Acceptable Use Policy",        version:"2026.1", desc:"Use of company devices, accounts, and the field/customer apps."},
    {key:"anti_harass",   title:"Anti-Harassment & Equal Opportunity",version:"2026.1",desc:"A workplace free of harassment and discrimination for all staff."},
    {key:"data_protect",  title:"Confidentiality & Data Protection", version:"2026.1", desc:"Handling of customer and company data under Jamaica's Data Protection Act, 2020."},
  ];

  // ── State ───────────────────────────────────────────────────────────────
  let ctx = null;                 // resolve() payload
  let P = {};                     // personal singleton (editable subset)
  let COL = {emergency_contacts:[], education:[], job_history:[]}; // collections
  let ACK = {};                   // policy key -> true
  let esign = {esign_full_name:"", esign_initials:"", agree:false};
  let step = 0;

  const STEPS = [
    {key:"welcome",   label:"Welcome"},
    {key:"personal",  label:"Personal info"},
    {key:"eligible",  label:"Work eligibility"},
    {key:"pay",       label:"Pay & banking"},
    {key:"policies",  label:"Policies"},
    {key:"diversity", label:"Diversity (optional)"},
    {key:"review",    label:"Review & sign"},
  ];

  // ── API ─────────────────────────────────────────────────────────────────
  async function api(method, path, body){
    const res = await fetch(path, {
      method, headers: body?{'Content-Type':'application/json'}:undefined,
      body: body?JSON.stringify(body):undefined,
    });
    let data=null; try{ data=await res.json(); }catch(_){}
    if(!res.ok){ const e=new Error((data&&data.detail)||res.statusText); e.status=res.status; e.detail=(data&&data.detail); throw e; }
    return data;
  }
  function payloadOut(){
    return { personal: P, collections: {
      emergency_contacts: COL.emergency_contacts,
      education: COL.education,
      job_history: COL.job_history,
      policy_acknowledgements: Object.keys(ACK).filter(k=>ACK[k]).map(k=>{
        const pol = POLICIES.find(p=>p.key===k)||{};
        return {policy:k, title:pol.title, version:pol.version};
      }),
    }};
  }
  let saveTimer;
  async function saveDraft(silent){
    if(ctx && ctx.locked) return;
    try{
      $('saveState').textContent='Saving…';
      await api('PUT','/api/onboard/save?token='+encodeURIComponent(TOKEN), payloadOut());
      $('saveState').textContent='Draft saved';
      if(!silent) toast('Progress saved');
    }catch(e){
      $('saveState').textContent='';
      toast(e.detail||'Could not save — check your connection','error');
      throw e;
    }
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  async function boot(){
    if(!TOKEN){ return screenError("This onboarding link is missing its access code. Please use the link HR sent you."); }
    let data;
    try{ data = await api('GET','/api/onboard/resolve?token='+encodeURIComponent(TOKEN)); }
    catch(e){
      if(e.status===410) return screenError("This onboarding link is invalid or has expired. Contact HR for a new link.");
      return screenError("We couldn't open your onboarding right now. Please try again shortly.");
    }
    ctx = data;
    const p = data.personal||{};
    // Hydrate editable singleton fields.
    ["preferred_name","pronouns","sex","date_of_birth","country_of_birth","marital_status",
     "primary_nationality","additional_nationalities","gender_identity",
     "home_address","home_city","home_parish","home_country","personal_phone","personal_email",
     "national_id","trn","nis","nht",
     "bank_name","bank_branch","bank_account_type","bank_account_number",
     "ethnicity","disability_status","accommodation_needed","accommodation_note"
    ].forEach(k=>{ if(p[k]!=null) P[k]=p[k]; });
    if(!P.home_country) P.home_country = "Jamaica";
    if(!P.primary_nationality) P.primary_nationality = "Jamaican";
    if(!P.country_of_birth) P.country_of_birth = "Jamaica";
    const c = data.collections||{};
    COL.emergency_contacts = c.emergency_contacts||[];
    COL.education = c.education||[];
    COL.job_history = c.job_history||[];
    (c.policy_acknowledgements||[]).forEach(a=>{ if(a&&a.policy) ACK[a.policy]=true; });
    if(data.locked){ return screenLocked(); }
    render();
  }

  // ── Terminal screens ──────────────────────────────────────────────────────
  function screenError(msg){
    root.innerHTML = `<div class="center-screen">
      <div class="big-ico" style="background:var(--danger-bg);color:var(--danger);">!</div>
      <h1 style="font-family:var(--font-display);font-size:22px;color:var(--ink);margin-bottom:8px;">Link unavailable</h1>
      <p style="color:var(--muted);line-height:1.6;">${esc(msg)}</p></div>`;
    $('saveState').textContent='';
  }
  function screenLocked(){
    root.innerHTML = `<div class="center-screen">
      <div class="big-ico" style="background:var(--ok-bg);color:var(--teal-dark);">✓</div>
      <h1 style="font-family:var(--font-display);font-size:22px;color:var(--ink);margin-bottom:8px;">Onboarding complete</h1>
      <p style="color:var(--muted);line-height:1.6;">Thanks, ${esc((ctx.legal_name||'').split(' ')[0]||'')}. You've already submitted your onboarding, so it's now locked.
      If something needs to change, contact HR and they'll update it for you.</p></div>`;
    $('saveState').textContent='Submitted';
  }
  function screenWelcome(){
    root.innerHTML = `<div class="center-screen">
      <div class="big-ico" style="background:var(--ok-bg);color:var(--teal-dark);">🎉</div>
      <h1 style="font-family:var(--font-display);font-size:24px;color:var(--ink);margin-bottom:8px;">Welcome aboard!</h1>
      <p style="color:var(--muted);line-height:1.6;">Thank you, ${esc((ctx.legal_name||'').split(' ')[0]||'')}. Your onboarding is submitted and locked.
      HR will be in touch with your start details and login. We're glad to have you at PrimeCool.</p></div>`;
    $('saveState').textContent='Submitted';
  }

  // ── Shell ──────────────────────────────────────────────────────────────────
  function render(){
    const rail = STEPS.map((s,i)=>`<button class="step ${i===step?'active':''} ${i<step?'done':''}" onclick="GO(${i})">
      <span class="num">${i<step?'✓':(i+1)}</span><span>${esc(s.label)}</span></button>`).join('');
    root.innerHTML = `<div class="wrap">
      <nav class="steps">${rail}</nav>
      <section class="panel" id="panel"></section>
    </div>`;
    renderStep();
  }
  window.GO = function(i){ // jump only to already-started or current/next step
    if(i>step+1) return;
    syncInputs(); step=i; render(); window.scrollTo(0,0);
  };

  function renderStep(){
    const k = STEPS[step].key;
    const panel = $('panel');
    if(k==='welcome')   panel.innerHTML = viewWelcome();
    else if(k==='personal')  panel.innerHTML = viewPersonal();
    else if(k==='eligible')  panel.innerHTML = viewEligible();
    else if(k==='pay')       panel.innerHTML = viewPay();
    else if(k==='policies')  panel.innerHTML = viewPolicies();
    else if(k==='diversity') panel.innerHTML = viewDiversity();
    else if(k==='review')    panel.innerHTML = viewReview();
  }

  // Read every [data-k] input on the current step back into state.
  function syncInputs(){
    document.querySelectorAll('[data-k]').forEach(el=>{
      const k=el.getAttribute('data-k');
      if(el.type==='checkbox'){ /* handled per-feature */ return; }
      P[k]= el.value;
    });
  }

  function opt(v,cur){ return `<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v)}</option>`; }
  function selField(label,k,opts,req){
    return `<div class="fld"><label>${esc(label)}${req?' <span class="req">*</span>':''}</label>
      <select data-k="${k}"><option value=""></option>${opts.map(o=>opt(o,P[k]||'')).join('')}</select></div>`;
  }
  function txtField(label,k,opts){
    opts=opts||{};
    return `<div class="fld ${opts.full?'full':''}"><label>${esc(label)}${opts.req?' <span class="req">*</span>':''}</label>
      <input type="${opts.type||'text'}" data-k="${k}" value="${esc(P[k]||'')}" placeholder="${esc(opts.ph||'')}" ${opts.ro?'readonly':''}>
      ${opts.hint?`<span class="hint">${esc(opts.hint)}</span>`:''}</div>`;
  }
  function navButtons(){
    return `<div class="actions">
      <button class="btn" onclick="BACK()" ${step===0?'style="visibility:hidden"':''}>Back</button>
      <button class="btn btn-teal" onclick="NEXT()">${step===STEPS.length-1?'Review':'Save &amp; continue'}</button>
    </div>`;
  }
  window.BACK=function(){ syncInputs(); if(step>0){step--; render(); window.scrollTo(0,0);} };
  window.NEXT=async function(){
    syncInputs();
    const err = validateStep();
    if(err){ toast(err,'error'); return; }
    try{ await saveDraft(true); }catch(_){ return; }
    if(step<STEPS.length-1){ step++; render(); window.scrollTo(0,0); }
  };

  // ── Step views ─────────────────────────────────────────────────────────────
  function viewWelcome(){
    return `<div class="card">
      <h1>Welcome to PrimeCool, ${esc((ctx.legal_name||'').split(' ')[0]||'')}!</h1>
      <p class="sub">We're excited to have you join the team. This short wizard collects the details we need to get you set up — it takes about 10 minutes.</p>
      <div class="banner info">Your progress saves automatically as you go, so you can step away and return using the same link.</div>
      <div class="banner warn"><strong>Please review carefully.</strong> Once you submit at the end, your information is locked and can only be changed by HR. So take your time and make sure everything is correct before the final step.</div>
      <div class="sec-head"><h3>What you'll need</h3></div>
      <ul style="color:var(--muted);font-size:13.5px;line-height:1.9;padding-left:20px;">
        <li>Your TRN (Tax Registration Number) and National ID</li>
        <li>Your NIS number (and NHT, if you have one)</li>
        <li>Bank account details for direct deposit of your salary</li>
        <li>An emergency contact</li>
      </ul>
      <div class="actions"><span></span><button class="btn btn-teal" onclick="NEXT()">Get started</button></div>
    </div>`;
  }

  function viewPersonal(){
    const ecs = COL.emergency_contacts.map((c,i)=>`<div class="item"><div>
        <div class="it-title">${esc(c.name||'(no name)')} ${c.is_primary?'· Primary':''}</div>
        <div class="it-meta">${esc(c.relationship||'')}${c.phone?' · '+esc(c.phone):''}</div>
      </div><div><button class="btn btn-sm btn-danger" onclick="ecDel(${i})">Remove</button></div></div>`).join('')
      || `<p style="color:var(--muted-2);font-size:13px;">No emergency contact added yet.</p>`;
    return `<div class="card">
      <h2>Personal information</h2>
      <p class="sub">Your legal name and work contact are managed by HR. Tell us how to reach you personally and a bit about you.</p>
      <div class="grid">
        ${txtField('Legal name','__legal',{ro:true,full:false})}
        ${txtField('Preferred name','preferred_name',{ph:'What you like to be called'})}
        ${selField('Sex','sex',['Male','Female','Prefer not to say'])}
        ${txtField('Date of birth','date_of_birth',{type:'date'})}
        ${selField('Marital status','marital_status',['Single','Married','Common-law','Divorced','Widowed','Separated'])}
        ${txtField('Country of birth','country_of_birth',{})}
        ${txtField('Primary nationality','primary_nationality',{})}
        ${txtField('Additional nationalities','additional_nationalities',{ph:'If any'})}
        ${txtField('Pronouns','pronouns',{ph:'Optional'})}
        ${txtField('Gender identity','gender_identity',{ph:'Optional'})}
      </div>
      <div class="sec-head" style="margin-top:22px;"><h3>Home contact</h3></div>
      <div class="grid">
        ${txtField('Personal phone','personal_phone',{type:'tel',ph:'e.g. 876-555-0123'})}
        ${txtField('Personal email','personal_email',{type:'email'})}
        ${txtField('Home address','home_address',{full:true})}
        ${txtField('City / Town','home_city',{})}
        ${selField('Parish','home_parish',PARISHES)}
        ${txtField('Country','home_country',{})}
      </div>
      <div class="sec-head" style="margin-top:22px;"><h3>Emergency contact</h3>
        <button class="btn btn-sm" onclick="ecAdd()">+ Add contact</button></div>
      ${ecs}
      ${navButtons()}
    </div>`;
  }
  window.ecAdd=function(){
    syncInputs();
    const name=prompt("Emergency contact — full name:"); if(!name) return;
    const relationship=prompt("Relationship (e.g. spouse, parent):")||"";
    const phone=prompt("Phone number:")||"";
    COL.emergency_contacts.push({name:name.trim(),relationship:relationship.trim(),phone:phone.trim(),
      is_primary:COL.emergency_contacts.length===0});
    renderStep();
  };
  window.ecDel=function(i){ COL.emergency_contacts.splice(i,1); renderStep(); };

  function viewEligible(){
    return `<div class="card">
      <h2>Work eligibility &amp; identification</h2>
      <p class="sub">As a Jamaican employer, we collect your statutory identifiers for payroll and lawful employment. These are stored securely and shared only as required by law (TAJ, NIS, NHT).</p>
      <div class="grid">
        ${txtField('TRN — Tax Registration Number','trn',{req:true,ph:'000-000-000',hint:'9 digits, issued by Tax Administration Jamaica.'})}
        ${txtField('National ID number','national_id',{req:true,hint:'Your NIDS, passport, or driver licence number.'})}
        ${txtField('NIS number','nis',{ph:'National Insurance Scheme #',hint:'Required for statutory contributions.'})}
        ${txtField('NHT number','nht',{ph:'Optional',hint:'National Housing Trust # — if you have one.'})}
      </div>
      <div class="banner info" style="margin-top:18px;">Right-to-work documents (ID, passport, work permit if applicable) will be verified in person with HR on your first day. You don't need to upload anything here.</div>
      ${navButtons()}
    </div>`;
  }

  function viewPay(){
    return `<div class="card">
      <h2>Pay &amp; banking</h2>
      <p class="sub">Your salary is paid by direct deposit. Enter the account where you'd like to be paid. Statutory deductions (PAYE, NIS, NHT, Ed. Tax) are handled automatically by payroll — there's no separate tax form to complete in Jamaica.</p>
      <div class="grid">
        ${selField('Bank','bank_name',BANKS,true)}
        ${txtField('Branch','bank_branch',{ph:'e.g. Half-Way-Tree'})}
        ${selField('Account type','bank_account_type',['Chequing','Savings'])}
        ${txtField('Account number','bank_account_number',{req:true})}
      </div>
      <div class="banner warn" style="margin-top:18px;">Double-check your account number. Incorrect details are the most common cause of a delayed first paycheque.</div>
      ${navButtons()}
    </div>`;
  }

  function viewPolicies(){
    const list = POLICIES.map(p=>`<label class="ack">
      <input type="checkbox" ${ACK[p.key]?'checked':''} onchange="ackSet('${p.key}',this.checked)">
      <span><span class="ack-t">${esc(p.title)} <span style="color:var(--muted-2);font-weight:500;">v${esc(p.version)}</span></span>
      <span class="ack-d">${esc(p.desc)}</span></span></label>`).join('');
    return `<div class="card">
      <h2>Policies &amp; documents</h2>
      <p class="sub">Please read and acknowledge each policy. By ticking the box you confirm you've received and understood it. HR can provide a full copy of any document on request.</p>
      ${list}
      <div class="banner info">All boxes must be ticked to continue.</div>
      ${navButtons()}
    </div>`;
  }
  window.ackSet=function(k,v){ ACK[k]=v; };

  function viewDiversity(){
    return `<div class="card">
      <h2>Diversity &amp; accessibility <span style="font-size:13px;color:var(--muted-2);font-weight:500;">(optional)</span></h2>
      <p class="sub">PrimeCool is an equal-opportunity employer. The questions below are entirely optional and used only, in aggregate, to support a fair and inclusive workplace. Your answers never affect your employment. You may skip any or all of them.</p>
      <div class="grid">
        ${selField('Ethnicity (optional)','ethnicity',['Prefer not to say','African / Black','Indian','Chinese','European / White','Mixed / Multiple','Lebanese / Syrian','Other'])}
        ${selField('Do you consider yourself a person with a disability?','disability_status',['Prefer not to say','No','Yes'])}
        ${selField('Do you need any workplace accommodation?','accommodation_needed',['No','Yes'])}
        ${txtField('If yes, briefly describe','accommodation_note',{full:true,ph:'Optional — helps us support you'})}
      </div>
      ${navButtons()}
    </div>`;
  }

  function viewReview(){
    const g = (title,rows)=>`<div class="review-grp"><div class="rh"><span>${esc(title)}</span></div><div class="rb">${
      rows.filter(r=>r[1]).map(r=>`<div class="rrow"><span class="rk">${esc(r[0])}</span><span class="rv">${esc(r[1])}</span></div>`).join('')
      || `<div class="rrow"><span class="rk" style="font-style:italic;">Nothing entered</span><span class="rv"></span></div>`}</div></div>`;
    const ackCount = Object.keys(ACK).filter(k=>ACK[k]).length;
    const review = [
      g('Personal', [['Legal name',ctx.legal_name],['Preferred name',P.preferred_name],['Sex',P.sex],
        ['Date of birth',P.date_of_birth],['Marital status',P.marital_status],['Nationality',P.primary_nationality]]),
      g('Home contact', [['Phone',P.personal_phone],['Email',P.personal_email],['Address',P.home_address],
        ['Parish',P.home_parish],['Country',P.home_country]]),
      g('Work eligibility', [['TRN',P.trn],['National ID',P.national_id],['NIS',P.nis],['NHT',P.nht]]),
      g('Banking', [['Bank',P.bank_name],['Branch',P.bank_branch],['Account type',P.bank_account_type],
        ['Account #',P.bank_account_number]]),
      g('Policies', [['Acknowledged',ackCount+' of '+POLICIES.length]]),
      g('Emergency contacts', [['Count',String(COL.emergency_contacts.length)]]),
    ].join('');
    return `<div class="card">
      <h2>Review &amp; sign</h2>
      <p class="sub">Please review everything below. Use <strong>Back</strong> or the step list to fix anything. When you sign and submit, your information locks and only HR can change it.</p>
      ${review}
      <div class="sec-head" style="margin-top:20px;"><h3>Electronic signature</h3></div>
      <div class="grid">
        ${txtField('Type your full legal name','esign_full_name',{req:true})}
        ${txtField('Initials','esign_initials',{req:true,ph:'e.g. J.B.'})}
      </div>
      <label class="ack" style="margin-top:14px;">
        <input type="checkbox" id="esignAgree" ${esign.agree?'checked':''}>
        <span><span class="ack-t">I confirm the information I've provided is true and complete.</span>
        <span class="ack-d">I understand that submitting locks my onboarding record and that changes afterward must be made by HR.</span></span></label>
      <div class="actions">
        <button class="btn" onclick="BACK()">Back</button>
        <button class="btn btn-teal" id="submitBtn" onclick="SUBMIT()">Submit onboarding</button>
      </div>
    </div>`;
  }

  // ── Validation ───────────────────────────────────────────────────────────
  function validateStep(){
    const k = STEPS[step].key;
    if(k==='eligible'){
      if(!(P.trn||'').trim()) return "Please enter your TRN.";
      if(!(P.national_id||'').trim()) return "Please enter your National ID number.";
    }
    if(k==='pay'){
      if(!(P.bank_name||'').trim()) return "Please choose your bank.";
      if(!(P.bank_account_number||'').trim()) return "Please enter your account number.";
    }
    if(k==='policies'){
      const missing = POLICIES.some(p=>!ACK[p.key]);
      if(missing) return "Please acknowledge every policy to continue.";
    }
    return null;
  }

  window.SUBMIT=async function(){
    syncInputs();
    esign.esign_full_name=(P.esign_full_name||'').trim();
    esign.esign_initials=(P.esign_initials||'').trim();
    esign.agree=$('esignAgree') && $('esignAgree').checked;
    if(POLICIES.some(p=>!ACK[p.key])){ toast("Please acknowledge every policy (Policies step) first.","error"); return; }
    if(!esign.esign_full_name || !esign.esign_initials){ toast("Please type your full name and initials to sign.","error"); return; }
    if(!esign.agree){ toast("Please tick the confirmation box to submit.","error"); return; }
    const btn=$('submitBtn'); if(btn){btn.disabled=true; btn.textContent='Submitting…';}
    const body = Object.assign(payloadOut(), {esign_full_name:esign.esign_full_name, esign_initials:esign.esign_initials});
    try{
      await api('POST','/api/onboard/submit?token='+encodeURIComponent(TOKEN), body);
      ctx.locked=true; screenWelcome(); window.scrollTo(0,0);
    }catch(e){
      if(btn){btn.disabled=false; btn.textContent='Submit onboarding';}
      toast(e.detail||'Submission failed — please try again','error');
    }
  };

  // Legal-name readonly is special: it isn't a P field, fill after render.
  const _renderStep = renderStep;
  renderStep = function(){ _renderStep(); const ln=document.querySelector('[data-k="__legal"]'); if(ln) ln.value=ctx.legal_name||''; };

  boot();
})();
</script>
</body>
</html>
